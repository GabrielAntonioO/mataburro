<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mataburro - Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: white;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .user {
      align-self: flex-end;
      background: #4CAF50;
      color: white;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 70%;
    }
    .ai {
      align-self: flex-start;
      background: #e8e8e8;
      color: #333;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 70%;
    }
    footer {
      background: white;
      padding: 12px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button#clear {
      background: #f44336;
    }
  </style>
</head>
<body>
<header><h1>🤔 Mataburro</h1><p>Chat educativo</p></header>
<div id="chat"></div>
<footer>
  <input type="text" id="input" placeholder="Escribe tu pregunta...">
  <button id="send">Enviar</button>
  <button id="clear">Limpiar</button>
</footer>

<script>
  const chatDiv = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const clearBtn = document.getElementById('clear');

  let messages = [];

  function load() {
    const saved = localStorage.getItem('mataburro_messages');
    messages = saved ? JSON.parse(saved) : [];
    render();
  }

  function save() {
    localStorage.setItem('mataburro_messages', JSON.stringify(messages));
  }

  function render() {
    chatDiv.innerHTML = '';
    messages.forEach(msg => {
      const div = document.createElement('div');
      div.className = msg.role;
      div.textContent = msg.content;
      chatDiv.appendChild(div);
    });
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    messages.push({ role: 'user', content: text });
    save();
    render();
    input.value = '';
    sendBtn.disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages.map(m => ({ role: m.role, content: m.content })) })
      });
      const data = await res.json();
      if (data.response) {
        messages.push({ role: 'ai', content: data.response });
        save();
        render();
      } else {
        throw new Error('Sin respuesta');
      }
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  clearBtn.onclick = () => {
    if (confirm('¿Borrar todo?')) {
      messages = [];
      save();
      render();
    }
  };
  sendBtn.onclick = sendMessage;
  input.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

  load();
  input.focus();
</script>
</body>
</html>
