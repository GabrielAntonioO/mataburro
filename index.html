<script>
  // ... resto de su código (variables, loadMessages, sendMessage, etc.) ...

  async function generateImage() {
    const prompt = imagePrompt.value.trim();
    if (!prompt) {
      alert('Describe la imagen que quieres generar');
      return;
    }

    imageBtn.disabled = true;
    imageBtn.textContent = '🎨 0%';

    try {
      // 1. Iniciar la predicción
      const startRes = await fetch('/api/generate-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });

      if (!startRes.ok) {
        const err = await startRes.json();
        throw new Error(err.error || 'Error al iniciar generación');
      }

      const { id } = await startRes.json();

      // 2. Hacer polling (consultar) cada 2 segundos
      let imageUrl = null;
      let elapsed = 0;
      const maxTime = 60000; // 60 segundos máximo
      const interval = 2000; // 2 segundos entre consultas

      // Mostrar un mensaje de "generando..."
      const loadingMsg = { role: 'assistant', type: 'loading', prompt: prompt };
      messages.push(loadingMsg);
      renderChat();

      while (!imageUrl && elapsed < maxTime) {
        await new Promise(r => setTimeout(r, interval));
        elapsed += interval;
        imageBtn.textContent = `🎨 ${Math.floor(elapsed/maxTime*100)}%`;

        const checkRes = await fetch(`/api/check-image?id=${id}`);
        const data = await checkRes.json();

        if (data.status === 'succeeded') {
          imageUrl = data.output?.[0];
          break;
        } else if (data.status === 'failed') {
          throw new Error(data.error || 'Fallo en generación');
        }
      }

      // Reemplazar el mensaje de "generando..." con la imagen
      messages = messages.filter(m => m !== loadingMsg);

      if (!imageUrl) {
        throw new Error('Tiempo de espera agotado');
      }

      // Agregar imagen al chat
      messages.push({
        role: 'assistant',
        type: 'image',
        prompt: prompt,
        url: imageUrl
      });
      saveMessages();
      renderChat();
      imagePrompt.value = '';

    } catch (error) {
      console.error(error);
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error';
      errorDiv.textContent = `❌ Error imagen: ${error.message}`;
      chatContainer.appendChild(errorDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      setTimeout(() => errorDiv.remove(), 5000);
    } finally {
      imageBtn.disabled = false;
      imageBtn.textContent = '🎨 Generar imagen';
    }
  }
  // ... resto de su código (event listeners, etc.) ...
</script>
