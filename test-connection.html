<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🌐 Test de Conexión a Hugging Face</title>
  <style>
    body { font-family: system-ui; background: #1a1a2e; color: white; padding: 30px; }
    .container { max-width: 700px; margin: auto; background: #16213e; padding: 30px; border-radius: 20px; }
    button { padding: 12px 20px; background: #4CAF50; border: none; color: white; border-radius: 8px; cursor: pointer; }
    #result { margin-top: 20px; background: #0a0a1a; padding: 15px; border-radius: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
<div class="container">
  <h1>🌐 Test de Conexión</h1>
  <p>Verifica si Vercel puede alcanzar el servidor de Hugging Face.</p>
  <button id="testBtn">▶️ Probar Conexión</button>
  <div id="result">Esperando...</div>
</div>

<script>
  document.getElementById('testBtn').onclick = async function() {
    const resultDiv = document.getElementById('result');
    resultDiv.textContent = '⏳ Probando...';
    try {
      const response = await fetch('/api/test-connection');
      const data = await response.json();
      resultDiv.textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      resultDiv.textContent = '❌ Error: ' + err.message;
    }
  };
</script>
</body>
</html>
