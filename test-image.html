<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧪 Test Hugging Face</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #16213e;
      padding: 30px;
      border-radius: 20px;
      max-width: 700px;
      width: 100%;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      margin: 10px 0;
    }
    button:disabled { opacity: 0.5; }
    #log {
      background: #0a0a1a;
      padding: 15px;
      border-radius: 10px;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      margin: 15px 0;
    }
    #result img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
    .info { color: #74c0fc; }
  </style>
</head>
<body>
<div class="container">
  <h1>🧪 Test Hugging Face</h1>
  <p>Prompt: "un perro surfeando en Honolulu, Hawai, estilo cartoon"</p>
  <button id="testBtn">🚀 Probar Generación</button>
  <div id="log">📋 Esperando acción...</div>
  <div id="result"></div>
</div>

<script>
  const logDiv = document.getElementById('log');
  const resultDiv = document.getElementById('result');
  const testBtn = document.getElementById('testBtn');

  function addLog(msg, type = 'info') {
    const entry = document.createElement('div');
    entry.className = type;
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  async function testGeneration() {
    resultDiv.innerHTML = '';
    addLog('🚀 Iniciando prueba...', 'info');
    testBtn.disabled = true;

    try {
      const prompt = 'un perro surfeando en Honolulu, Hawai, estilo cartoon colorido, olas, sol';
      addLog(`📤 Enviando prompt: "${prompt}"`, 'info');

      const response = await fetch('/api/generate-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });

      addLog(`📥 Respuesta: ${response.status} ${response.statusText}`, 'info');

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error || `Error ${response.status}`);
      }

      const data = await response.json();
      
      if (data.success && data.image) {
        addLog('✅ ¡Imagen generada!', 'success');
        resultDiv.innerHTML = `
          <p style="color:#51cf66;">✅ Éxito</p>
          <img src="${data.image}" alt="Imagen generada" />
        `;
      } else {
        throw new Error('No se recibió imagen');
      }

    } catch (err) {
      addLog(`❌ Error: ${err.message}`, 'error');
      resultDiv.innerHTML = `<p style="color:#ff6b6b;">❌ ${err.message}</p>`;
    } finally {
      testBtn.disabled = false;
      addLog('🏁 Prueba finalizada', 'info');
    }
  }

  testBtn.onclick = testGeneration;
</script>
</body>
</html>
